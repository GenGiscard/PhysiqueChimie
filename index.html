<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Conseils de classe physique-chimie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : barre de pilotage collante (classe, trimestre, onglets), puis une feuille de travail large par onglet */
:root{
  --paper:#eef1f6; --card:#ffffff; --ink:#16202e; --muted:#5b6676; --line:#d5dce6; --soft:#e4e9f1;
  --accent:#2340a8; --accent-ink:#ffffff;
  --fel:#9a6c00; --fel-bg:#fbf0d3; --comp:#6b46c1; --comp-bg:#eee7fb; --enc:#2f7d4f; --enc-bg:#e2f3e8;
  --trav:#b85600; --trav-bg:#fde9d6; --comp2:#b3261e; --comp2-bg:#fbe1df;
  --f-display:"Bitter",Georgia,serif; --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f141b; --card:#18202b; --ink:#e6ebf2; --muted:#9aa6b6; --line:#2b3545; --soft:#212b38;
  --accent:#8ea8ff; --accent-ink:#0f141b;
  --fel:#e8b84a; --fel-bg:#3a2f12; --comp:#b99ef5; --comp-bg:#2d2440; --enc:#6cc792; --enc-bg:#173325;
  --trav:#f0a050; --trav-bg:#3b2814; --comp2:#f2776e; --comp2-bg:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f141b; --card:#18202b; --ink:#e6ebf2; --muted:#9aa6b6; --line:#2b3545; --soft:#212b38;
  --accent:#8ea8ff; --accent-ink:#0f141b;
  --fel:#e8b84a; --fel-bg:#3a2f12; --comp:#b99ef5; --comp-bg:#2d2440; --enc:#6cc792; --enc-bg:#173325;
  --trav:#f0a050; --trav-bg:#3b2814; --comp2:#f2776e; --comp2-bg:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ===== Header ESTIC ===== */
.estic-bar{display:flex;align-items:center;gap:11px;padding:8px 18px;background:var(--card);border-bottom:1px solid var(--line);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.estic-bar .estic-logo{height:30px;width:auto;display:block;flex:0 0 auto}
.estic-bar .estic-txt{display:flex;flex-direction:column;line-height:1.12}
.estic-bar .estic-txt strong{font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.estic-bar .estic-txt span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.estic-bar .estic-copy{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:right;line-height:1.3}
@media(max-width:560px){.estic-bar .estic-copy{font-size:8.5px}.estic-bar .estic-logo{height:26px}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:20px}
.h1sub{font-weight:600;color:var(--muted)}
.brand small{color:var(--muted);font-size:13px}
.pick{display:flex;gap:8px;align-items:center}
.pick label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=number],input[type=text],input[type=search],input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;resize:vertical;min-height:64px}
.tabs{max-width:1180px;margin:0 auto;padding:6px 16px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap;cursor:pointer}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-inline:16px;display:grid;gap:18px}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--comp2);border-color:var(--comp2)}
.btn.small{padding:4px 9px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 200px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{font-size:17px}
.hint{color:var(--muted);font-size:13px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}

.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
.stat b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stat.fel{background:var(--fel-bg);color:var(--fel);border-color:transparent}
.stat.comp{background:var(--comp-bg);color:var(--comp);border-color:transparent}
.stat.enc{background:var(--enc-bg);color:var(--enc);border-color:transparent}
.stat.trav{background:var(--trav-bg);color:var(--trav);border-color:transparent}
.stat.cpt{background:var(--comp2-bg);color:var(--comp2);border-color:transparent}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--soft);position:sticky;top:0}
td.n{text-align:right;width:70px}
tr.open td{background:var(--soft)}
tr.edit td{background:var(--soft);padding-top:0}
.name{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:700}
.name span{font-weight:400}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:8px;vertical-align:middle}
.dot.on{background:var(--accent)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:5px 9px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].m-{background:var(--soft);color:var(--ink)}
.seg button[aria-pressed="true"].m-enc{background:var(--enc-bg);color:var(--enc)}
.seg button[aria-pressed="true"].m-comp{background:var(--comp-bg);color:var(--comp)}
.seg button[aria-pressed="true"].m-fel{background:var(--fel-bg);color:var(--fel)}
.tog{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.tog[aria-pressed="true"].g-travail{background:var(--trav-bg);color:var(--trav);border-color:var(--trav)}
.tog[aria-pressed="true"].g-comportement{background:var(--comp2-bg);color:var(--comp2);border-color:var(--comp2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 0 6px}
.edit-grid > div{display:grid;gap:4px;min-width:0}

/* Conseil en direct */
.live{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
.roster{background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:72vh;overflow:auto;padding:6px}
.roster button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:6px;border:0;background:none;padding:7px 8px;border-radius:6px;text-align:left;cursor:pointer;font-size:14px}
.roster button[aria-current="true"]{background:var(--soft);font-weight:700}
.roster .marks{display:flex;gap:3px}
.mk{width:9px;height:9px;border-radius:2px}
.mk.enc{background:var(--enc)}.mk.comp{background:var(--comp)}.mk.fel{background:var(--fel)}.mk.travail{background:var(--trav)}.mk.comportement{background:var(--comp2)}
.mk.vu{background:var(--muted);border-radius:50%}
.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px;min-width:0}
.stage-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.stage-head h2{font-size:30px}
.stage-head h2 span{font-weight:600;color:var(--muted)}
.big-num{display:flex;gap:18px;flex-wrap:wrap}
.big-num div{display:grid}
.big-num b{font-family:var(--f-mono);font-size:28px;font-variant-numeric:tabular-nums}
.subjects{display:flex;flex-wrap:wrap;gap:6px}
.subjects span{font-size:13px;background:var(--soft);border-radius:4px;padding:2px 8px}
.quote{border-left:3px solid var(--accent);padding:4px 12px;color:var(--muted);font-size:14px}
.seg.big button{padding:10px 14px;font-size:15px}
.tog.big{padding:8px 14px;font-size:15px}
.progress{height:6px;background:var(--soft);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.timer{display:flex;align-items:center;gap:8px}
.timer b{font-family:var(--f-mono);font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two > div{display:grid;gap:4px;min-width:0}

/* Compte-rendu */
.cr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.field{display:grid;gap:4px}
pre.out{white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:8px;padding:14px;font-family:var(--f-mono);font-size:13px;line-height:1.5;margin:0;max-height:70vh;overflow:auto}

.profs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.prof{display:grid;gap:6px;align-content:start;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft);min-width:0}
.prof-head{display:flex;gap:8px;align-items:center}
.prof-mat{flex:1;min-width:0;font-weight:700;background:transparent!important;border-color:transparent!important;padding-left:0!important;font-family:var(--f-display)}
.prof-mat:focus{border-color:var(--line)!important;background:var(--card)!important;padding-left:8px!important}
.prof-avg{font-size:14px;color:var(--muted)}
.prof textarea{min-height:72px}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--trav-bg);color:var(--trav);font-size:12px;text-align:center}
.note-line{font-size:13px;color:var(--muted);margin-top:3px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-count{font-weight:700;color:var(--trav)}
.act-count.ok{color:var(--enc)}
.mk.act{background:var(--accent);border-radius:2px;transform:rotate(45deg);width:8px;height:8px}
.tasks{display:grid;gap:6px}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer}
.task input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto}
.task.done span{text-decoration:line-through;color:var(--muted)}
.act-student{display:grid;grid-template-columns:240px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.act-student .who{font-weight:700}
.act-student .who span:not(.pill){font-weight:400}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-top:4px}
.pill.m-enc{background:var(--enc-bg);color:var(--enc)}.pill.m-comp{background:var(--comp-bg);color:var(--comp)}.pill.m-fel{background:var(--fel-bg);color:var(--fel)}
.pill.g-travail{background:var(--trav-bg);color:var(--trav)}.pill.g-comportement{background:var(--comp2-bg);color:var(--comp2)}
@media (max-width:820px){.act-student{grid-template-columns:1fr}.note-line{max-width:220px}}
.sync-pill{margin-left:6px;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;cursor:pointer}
.sync-pill[data-st="ok"]{background:var(--enc-bg);color:var(--enc);border-color:transparent}
.sync-pill[data-st="run"]{background:var(--soft);color:var(--accent)}
.sync-pill[data-st="wait"]{background:var(--fel-bg);color:var(--fel);border-color:transparent}
.sync-pill[data-st="err"]{background:var(--comp2-bg);color:var(--comp2);border-color:transparent}
.dropbox{display:grid;gap:2px;border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;background:var(--soft)}
.dropbox:hover{border-color:var(--accent)}
.dropbox span{font-size:13px;color:var(--muted)}
.dropzone{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(35,64,168,.18);pointer-events:none}
.dropzone > div{display:grid;gap:6px;text-align:center;background:var(--card);color:var(--ink);border:3px dashed var(--accent);border-radius:16px;padding:40px 32px;max-width:520px;width:100%}
.dropzone b{font-family:var(--f-display);font-size:22px}
.dropzone span{color:var(--muted)}
.cc.over{color:var(--comp2);font-weight:700}
.ed-help{display:grid;gap:8px;border:1px solid var(--accent);border-radius:8px;padding:12px 14px;background:var(--card)}
.ed-help ol{margin:0;padding-left:20px;display:grid;gap:4px}
.ed-help .warn{margin:0;color:var(--comp2);font-weight:700}
.tuto-btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 20px;font-family:var(--f-display);font-weight:700;font-size:18px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#e8590c,#d6336c);box-shadow:0 4px 14px rgba(214,51,108,.35);transition:transform .15s,box-shadow .15s}
.tuto-btn svg{width:22px;height:22px}
.tuto-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(214,51,108,.45)}
.tuto-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tuto-box{position:fixed;inset:0;z-index:80;background:rgba(10,14,20,.6);display:grid;place-items:center;padding:16px}
.tuto-inner{width:min(1160px,100%);height:min(92vh,100%);background:var(--card);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.tuto-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.tuto-bar b{font-family:var(--f-display)}
.tuto-inner iframe{width:100%;height:100%;border:0;display:block}
/* Appréciations */
.gen-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:8px;padding:10px 12px}
.gen-bar > div:first-child{display:grid}
.bav{display:grid;gap:2px;margin-top:8px;font-weight:400}
.bav .label{font-size:10.5px}
.bav input{width:100%;accent-color:var(--enc)}
.bav input.lvl-1{accent-color:var(--fel)}
.bav input.lvl-2{accent-color:var(--trav)}
.bav input.lvl-3,.bav input.lvl-4{accent-color:var(--comp2)}
.bav-val{font-size:12px;font-weight:700;color:var(--enc)}
.bav-val.lvl-1{color:var(--fel)}.bav-val.lvl-2{color:var(--trav)}.bav-val.lvl-3,.bav-val.lvl-4{color:var(--comp2)}
.bank{display:grid;gap:10px}
.bank-cat{display:grid;gap:6px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.app-row{display:grid;grid-template-columns:200px 90px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.app-row:last-child{border-bottom:0}
.app-row .who{font-weight:700}
.app-row .who span{display:block;font-weight:400;color:var(--muted);font-size:13px}
.app-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:4px}
.app-row.active textarea{border-color:var(--accent)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.confirm{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--comp2-bg);color:var(--comp2);border-radius:6px;padding:6px 10px;font-weight:700;font-size:14px}
.radio{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal .panel{width:min(640px,100%)}
.modal textarea{min-height:240px;font-family:var(--f-mono);font-size:12px}

@media (max-width:820px){
  .live,.cr,.grid2,.two,.edit-grid{grid-template-columns:1fr}
  .roster{max-height:200px}
  .app-row{grid-template-columns:1fr 90px}
  .app-row > :last-child{grid-column:1 / -1}
  .stage-head h2{font-size:24px}
}
.apps-grid{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media (max-width:820px){ .apps-grid{grid-template-columns:1fr} .apps-grid > .bank{order:2} }

/* ===== Téléphone ===== */
@media (max-width:640px){
  body{font-size:15px}
  input,select,textarea{font-size:16px}
  .estic-bar{padding:6px 12px}
  .estic-bar .estic-copy{display:none}
  .bar{padding:8px 12px 0;gap:8px}
  .brand{width:100%;gap:8px;align-items:center}
  .brand h1{font-size:18px}
  .brand small{display:none}
  .sync-pill{margin-left:auto}
  .pick{flex:1 1 0;min-width:0}
  .pick label{display:none}
  .pick select{width:100%;padding:7px 6px}
  .tuto-btn{padding:7px 12px;font-size:15px;border-radius:10px}
  .tuto-btn svg{width:18px;height:18px}
  .tabs{padding:2px 6px 0}
  .tab{padding:10px 10px;font-size:14px}
  main{padding-block:14px 80px;padding-inline:12px;gap:14px}
  .panel{padding:12px}
  .stats{gap:6px}
  .stat{padding:4px 10px;font-size:13px}
  .btn{padding:9px 12px}
  .btn.small{padding:7px 10px}
  .seg button{padding:8px 10px;font-size:13px}
  .tog{padding:7px 11px}
  /* Préparer : une carte par élève */
  .prep-cards{border:0;background:none;overflow:visible}
  .prep-cards table{min-width:0;border-collapse:separate}
  .prep-cards thead{display:none}
  .prep-cards tbody{display:grid;gap:10px}
  .prep-cards tr{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .prep-cards tr.open{border-color:var(--accent)}
  .prep-cards td{display:block;padding:0;border:0;background:none!important}
  .prep-cards td.n{width:auto;text-align:right;font-size:15px}
  .prep-cards td.n::before{content:attr(data-l);display:block;font-family:var(--f-body);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .prep-cards td.c-men,.prep-cards td.c-meg{grid-column:1 / -1}
  .prep-cards td:last-child:not([colspan]){display:none}
  .prep-cards tr.edit{display:block;margin-top:-12px;border-top:0;border-radius:0 0 12px 12px}
  .prep-cards tr.edit td{display:block}
  .note-line{max-width:none;white-space:normal}
  /* Conseil en direct */
  .roster{max-height:150px}
  .stage{padding:14px}
  .stage-head h2{font-size:21px}
  .big-num{gap:14px}
  .big-num b{font-size:22px}
  .seg.big{display:flex;flex-wrap:wrap}
  .seg.big button{flex:1 1 40%;padding:10px 8px}
  .navrow .btn{flex:1}
  .navrow{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);padding:8px 0 0}
  .timer b{font-size:16px}
  /* Mes appréciations */
  .app-row{grid-template-columns:1fr 84px;padding:14px 0}
  .gen-bar{flex-direction:column;align-items:stretch}
  .gen-bar .toolbar .btn{flex:1}
  [data-act="ed-script"]{display:none}
  .ed-help{display:none}
  /* Compte-rendu, actions */
  .profs{grid-template-columns:1fr}
  pre.out{max-height:50vh}
  .tuto-box{padding:0}
  .tuto-inner{height:100%;border-radius:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>const TUTO_HTML = "<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><\/head><body style=\"margin:0\"><title>Tuto Conseils de classe physique-chimie<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap\">\n<style>\n/* Layout : une scène par geste — écran animé à gauche, 3 ou 4 consignes courtes à droite, qui s'allument au rythme du curseur */\n:root{\n  --paper:#eef1f6; --card:#ffffff; --ink:#16202e; --muted:#5b6676; --line:#d5dce6; --soft:#e4e9f1;\n  --accent:#2340a8; --accent-ink:#ffffff; --ok:#2f7d4f; --ok-bg:#e2f3e8; --warn:#b85600; --warn-bg:#fde9d6; --bad:#b3261e; --bad-bg:#fbe1df;\n  --desk:#cfd8e6; --ed:#1f5aa6;\n  --f-display:\"Bitter\",Georgia,serif; --f-body:\"Atkinson Hyperlegible\",system-ui,-apple-system,\"Segoe UI\",sans-serif; --f-mono:\"IBM Plex Mono\",ui-monospace,Menlo,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --paper:#0f141b; --card:#18202b; --ink:#e6ebf2; --muted:#9aa6b6; --line:#2b3545; --soft:#212b38;\n  --accent:#8ea8ff; --accent-ink:#0f141b; --ok:#6cc792; --ok-bg:#173325; --warn:#f0a050; --warn-bg:#3b2814; --bad:#f2776e; --bad-bg:#3d1c1a;\n  --desk:#253041; --ed:#7fb0ff; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --paper:#0f141b; --card:#18202b; --ink:#e6ebf2; --muted:#9aa6b6; --line:#2b3545; --soft:#212b38;\n  --accent:#8ea8ff; --accent-ink:#0f141b; --ok:#6cc792; --ok-bg:#173325; --warn:#f0a050; --warn-bg:#3b2814; --bad:#f2776e; --bad-bg:#3d1c1a;\n  --desk:#253041; --ed:#7fb0ff; color-scheme:dark}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nbody{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}\nh1,h2{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}\nkbd{font-family:var(--f-mono);font-size:.85em;background:var(--card);border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:1px 6px}\n.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 60px;display:grid;gap:22px}\n.top{display:grid;gap:6px}\n.top h1{font-size:clamp(26px,4vw,38px)}\n.top p{margin:0;color:var(--muted)}\n.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}\n.chips a{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px}\n.chips a b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px}\n.chips a:hover{border-color:var(--accent)}\n\n.scene{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;scroll-margin-top:12px}\n.scene-head{display:flex;align-items:center;gap:12px}\n.scene-head .num{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:18px;flex:0 0 auto}\n.scene-head h2{font-size:22px;flex:1}\n.replay{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}\n.replay:hover{border-color:var(--accent)}\n.replay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.scene-body{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}\n.caps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:c}\n.caps li{counter-increment:c;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);color:var(--muted);transition:background .3s,color .3s,border-color .3s}\n.caps li::before{content:counter(c);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:13px;transition:all .3s}\n.caps li.on{background:var(--soft);color:var(--ink);border-color:var(--accent)}\n.caps li.on::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}\n.caps li.done{color:var(--ink)}\n.caps li.done::before{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);content:\"\\2713\"}\n.note{margin:4px 0 0;font-size:14px;color:var(--muted)}\n\n/* ----- écran animé : conçu en 720 x 420, mis à l'échelle ----- */\n.stage-wrap{position:relative;width:100%;overflow:hidden;border-radius:10px;background:var(--desk)}\n.stage{position:absolute;left:0;top:0;width:720px;height:420px;transform-origin:0 0;font-size:13px;color:var(--ink);overflow:hidden}\n.cursor{position:absolute;left:640px;top:360px;width:22px;height:30px;z-index:50;pointer-events:none;transition:left .7s cubic-bezier(.45,.05,.25,1),top .7s cubic-bezier(.45,.05,.25,1),transform .15s}\n.cursor svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}\n.cursor.press{transform:scale(.82)}\n.ripple{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--accent);z-index:49;pointer-events:none;animation:rip .5s ease-out forwards}\n@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}\n.keycap{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);z-index:48;display:flex;gap:6px;opacity:0;transition:all .25s}\n.keycap.show{opacity:1;transform:translateX(-50%)}\n.keycap span{font-family:var(--f-mono);font-size:22px;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-bottom-width:5px;border-radius:8px;padding:4px 14px} "cnt\" data-k=\"n3\">0 / 200<\/span><\/div>\n            <div class=\"console\" data-k=\"console\"><div class=\"ctabs\"><span>Éléments<\/span><b>Console<\/b><span>Sources<\/span><\/div><div class=\"line\" data-k=\"cline\"><\/div><\/div>\n            <div class=\"alert hide\" data-k=\"alert\"><span>27 appréciation(s) remplie(s).<br>Vérifiez puis cliquez sur la disquette pour enregistrer.<\/span><span class=\"btn primary\" data-k=\"okbtn\">OK<\/span><\/div>\n            <div class=\"toast hide\" data-k=\"saved\">Enregistré<\/div>\n          <\/div>\n        <\/div>\n        <div class=\"keycap\" data-k=\"key\"><\/div>\n      <\/div><\/div>\n      <div><ol class=\"caps\"><li>Dans l’appli : Remplir École Directe.<\/li><li>Dans École Directe : Appréciations de la même classe.<\/li><li><span><kbd>F12<\/kbd>, onglet Console.<\/span><\/li><li><span><kbd>Ctrl<\/kbd>+<kbd>V<\/kbd> puis <kbd>Entrée<\/kbd> : tout se remplit.<\/span><\/li><li>Vérifiez, puis la disquette.<\/li><\/ol>\n        <p class=\"note\">Première fois : tapez « autoriser le collage », <kbd>Entrée<\/kbd>, puis recollez.<\/p><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- En cas de souci -->\n  <section class=\"scene\" id=\"s6\">\n    <div class=\"scene-head\"><span class=\"num\" style=\"background:var(--warn)\">?<\/span><h2>En cas de souci<\/h2><\/div>\n    <div class=\"probs\">\n      <div class=\"prob\"><div class=\"vis\"><span class=\"pill\" style=\"background:var(--bad-bg);color:var(--bad)\">Synchro impossible<\/span><\/div>\n        <p><b>Pastille rouge<\/b>Vérifiez Internet, puis Données &gt; Synchroniser maintenant.<\/p><\/div>\n      <div class=\"prob\"><div class=\"vis\"><span class=\"note-box\" style=\"border-color:var(--bad);color:var(--bad);font-weight:700\">214 / 200<\/span><\/div>\n        <p><b>Compteur rouge<\/b>Raccourcissez le texte avant de coller.<\/p><\/div>\n      <div class=\"prob\"><div class=\"vis\"><span class=\"note-box\">—<\/span><span class=\"ta\" style=\"min-height:0;flex:1;color:var(--muted)\">vide<\/span><\/div>\n        <p><b>Élève sans appréciation<\/b>Pas de note de physique-chimie : saisissez-la, puis Rédiger.<\/p><\/div>\n      <div class=\"prob\"><div class=\"vis\"><span class=\"btn\">Copier<\/span><\/div>\n        <p><b>Élève non trouvé<\/b>Bonne classe ouverte ? Sinon, bouton Copier pour lui seul.<\/p><\/div>\n      <div class=\"prob\"><div class=\"vis\"><span class=\"btn\">Données<\/span><span class=\"btn\">Sauvegarde<\/span><\/div>\n        <p><b>Une copie de secours<\/b>De temps en temps : Données &gt; Sauvegarde.<\/p><\/div>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\n\"use strict\";\nconst REDUCED = window.matchMedia && matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst SPEED = REDUCED ? 0.01 : 1;\nconst CURSOR = '<div class=\"cursor\"><svg viewBox=\"0 0 22 30\"><path d=\"M2 2 L2 24 L8 18 L12 28 L16 26 L12 17 L20 17 Z\" fill=\"#ffffff\" stroke=\"#16202e\" stroke-width=\"2\" stroke-linejoin=\"round\"/><\/svg><\/div>';\n\n/* mise à l'échelle de chaque écran */\nfunction fit(){\n  document.querySelectorAll(\".stage-wrap\").forEach(w=>{\n    const st = w.querySelector(\".stage\"), sc = w.clientWidth / 720;\n    st.style.transform = `scale(${sc})`;\n    w.style.height = (420*sc) + \"px\";\n  });\n}\nwindow.addEventListener(\"resize\", fit);\n\n/* moteur de scène : curseur, clics, saisie, consignes */\nfunction makeCtx(sec){\n  const stage = sec.querySelector(\".stage\"), caps = [...sec.querySelectorAll(\".caps li\")];\n  const tok = {alive:true};\n  const $ = k => stage.querySelector(`[data-k=\"${k}\"]`);\n  const cur = () => stage.querySelector(\".cursor\");\n  const check = () => { if(!tok.alive) throw \"stop\"; };\n  const wait = ms => new Promise((res,rej)=>setTimeout(()=>tok.alive ? res() : rej(\"stop\"), ms*SPEED));\n  const where = el => {\n    const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect(), k = s.width/720 || 1;\n    return {x:(r.left - s.left + r.width/2)/k, y:(r.top - s.top + r.height/2)/k};\n  };\n  const ctx = {\n    tok, $, wait,\n    cap(i){ caps.forEach((li,j)=>{ li.classList.toggle(\"on\", j===i); li.classList.toggle(\"done\", j<i); }); },\n    async move(el, dx=0, dy=0){ check(); const p = where(el); const c = cur(); c.style.left = (p.x+dx-3)+\"px\"; c.style.top = (p.y+dy-3)+\"px\"; await wait(800); },\n    async moveXY(x,y){ check(); const c = cur(); c.style.left = x+\"px\"; c.style.top = y+\"px\"; await wait(800); },\n    async click(){\n      check(); const c = cur(); c.classList.add(\"press\");\n      const r = document.createElement(\"span\"); r.className = \"ripple\";\n      r.style.left = (parseFloat(c.style.left)+3)+\"px\"; r.style.top = (parseFloat(c.style.top)+3)+\"px\";\n      stage.appendChild(r); await wait(160); c.classList.remove(\"press\"); setTimeout(()=>r.remove(), 500); await wait(220);\n    },\n    async type(el, text, ms=55){ for(const ch of text){ check(); el.textContent += ch; await wait(ms); } },\n    async key(...keys){ check(); const k = $(\"key\"); k.innerHTML = keys.map(x=>`<span>${x}<\/span>`).join(\"\"); k.classList.add(\"show\"); await wait(900); k.classList.remove(\"show\"); await wait(250); },\n    finish(){ caps.forEach(li=>{ li.classList.remove(\"on\"); li.classList.add(\"done\"); }); }\n  };\n  return ctx;\n}\n\n/* ---------------- scénarios ---------------- */\nconst TEXTS = {\n  a1: \"Léo obtient de très bons résultats en physique-chimie. Quelques bavardages sont toutefois à éviter. Continuez ainsi.\",\n  a1b: \"Très bon niveau pour Léo, les compétences sont bien maîtrisées. L’attitude est globalement correcte, malgré quelques bavardages. Bravo, poursuivez dans cette voie.\",\n  a2: \"Excellent trimestre pour Inès en physique-chimie. Les bavardages et les distractions nuisent au travail. Les capacités sont là, il faut maintenant soigner l’attitude.\",\n  a3: \"Nathan obtient des résultats corrects en physique-chimie. L’attitude en classe est exemplaire. Il faut poursuivre les efforts pour progresser.\"\n};\nconst SCENES = {\n  async open(c){\n    c.cap(0); await c.wait(500);\n    await c.move(c.$(\"file\")); c.$(\"file\").classList.add(\"sel-on\"); await c.click(); await c.click();\n    c.$(\"win\").classList.remove(\"hide\"); await c.wait(900);\n    c.cap(1); await c.move(c.$(\"cls\")); await c.click(); c.$(\"dd\").hidden = false; await c.wait(900);\n    c.cap(2); await c.wait(2200); c.$(\"dd\").hidden = true;\n  },\n  async sync(c){\n    c.cap(0); await c.wait(500);\n    await c.move(c.$(\"t-data\")); await c.click();\n    c.$(\"t-prep\").classList.remove(\"cur\"); c.$(\"t-data\").classList.add(\"cur\"); c.$(\"prep\").hidden = true; c.$(\"data\").hidden = false; await c.wait(600);\n    c.cap(1); await c.move(c.$(\"pass\")); await c.click(); c.$(\"pass\").classList.add(\"focus\"); await c.type(c.$(\"pass\"), \"••••••••••••\", 90); c.$(\"pass\").classList.remove(\"focus\");\n    c.cap(2); await c.move(c.$(\"go\")); await c.click(); c.$(\"go\").classList.add(\"hit\");\n    const p = c.$(\"pill\"); p.textContent = \"Synchronisation…\"; p.className = \"pill run\"; await c.wait(1200);\n    c.$(\"go\").classList.remove(\"hit\");\n    c.cap(3); p.textContent = \"Synchronisé 21h18\"; p.className = \"pill ok\"; await c.move(p, 0, 14);\n    p.classList.add(\"ring\"); await c.wait(2400);\n  },\n  async drop(c){\n    c.cap(0); await c.wait(500);\n    const f = c.$(\"file\"); await c.move(f); await c.click(); f.style.zIndex = 40;\n    c.$(\"dz\").classList.remove(\"hide\");\n    const cur = c.$(\"win\").parentElement.querySelector(\".cursor\");\n    cur.style.left = \"400px\"; cur.style.top = \"200px\"; f.style.left = \"350px\"; f.style.top = \"170px\"; await c.wait(900);\n    await c.click(); c.$(\"dz\").classList.add(\"hide\"); f.style.opacity = \"0\";\n    c.cap(1); c.$(\"toast\").classList.remove(\"hide\"); await c.wait(700);\n    c.cap(2);\n    const vals = [\"14,50\",\"16,00\",\"11,00\",\"17,50\",\"12,50\"];\n    for(let i=0;i<5;i++){ const e = c.$(\"e\"+(i+1)); e.textContent = vals[i]; e.classList.add(\"new\"); await c.wait(220); }\n    await c.wait(2400);\n  },\n  async write(c){\n    c.cap(0); await c.wait(500);\n    const th = c.$(\"thumb\"); await c.move(th); await c.click();\n    const cur = th.closest(\".stage\").querySelector(\".cursor\");\n    const p0 = parseFloat(cur.style.left);\n    th.style.left = \"75%\"; cur.style.left = (p0 + 60) + \"px\"; await c.wait(800);\n    th.classList.add(\"l3\"); const lv = c.$(\"lvl\"); lv.textContent = \"Fréquents\"; lv.classList.add(\"l3\"); await c.wait(600);\n    c.cap(1); await c.move(c.$(\"gen\")); await c.click();\n    for(const k of [\"a1\",\"a2\",\"a3\"]){\n      const el = c.$(k), cnt = c.$(\"c\"+k.slice(1)); el.classList.add(\"fill\");\n      const t = TEXTS[k];\n      for(let i=0;i<t.length;i+=3){ el.textContent = t.slice(0,i+3); cnt.textContent = `${Math.min(i+3,t.length)} / 200`; await c.wait(14); }\n    }\n    await c.wait(700);\n    c.cap(2); await c.move(c.$(\"other\")); await c.click();\n    c.$(\"a1\").textContent = TEXTS.a1b; c.$(\"c1\").textContent = `${TEXTS.a1b.length} / 200`; await c.wait(1000);\n    c.cap(3); await c.move(c.$(\"a2\")); await c.wait(2400);\n  },\n  async export(c){\n    c.cap(0); await c.wait(500);\n    await c.move(c.$(\"m-cons\")); await c.click(); c.$(\"m-cons\").classList.add(\"cur\"); await c.wait(300);\n    c.$(\"vA\").hidden = true; c.$(\"vB\").hidden = false; await c.wait(500);\n    c.cap(1); await c.move(c.$(\"c3a\")); await c.click(); c.$(\"c3a\").classList.add(\"cur\");\n    c.$(\"ctitle\").textContent = \"TROISIEME A (27 élèves)\"; c.$(\"tools\").hidden = false; c.$(\"pp\").hidden = false; c.$(\"photos\").hidden = false; await c.wait(700);\n    c.cap(2); await c.move(c.$(\"i-ed\")); await c.click(); c.$(\"i-ed\").classList.add(\"cur\"); await c.wait(300);\n    c.$(\"vB\").hidden = true; c.$(\"vC\").hidden = false; await c.wait(600);\n    c.cap(3); await c.move(c.$(\"t1\")); await c.click(); c.$(\"t1\").classList.add(\"hit\");\n    c.cap(4); const dl = c.$(\"dl\"); dl.classList.remove(\"hide\");\n    for(let i=0;i<=100;i+=10){ c.$(\"bar\").style.width = i+\"%\"; await c.wait(60); }\n    c.$(\"dlt\").textContent = \"Terminé : dans Téléchargements\"; dl.classList.add(\"done\"); await c.move(dl.querySelector(\".dlic\"), 0, 24); await c.wait(2400);\n  },\n  async ed(c){\n    c.cap(0); await c.wait(500);\n    await c.move(c.$(\"edbtn\")); await c.click(); c.$(\"toast\").classList.remove(\"hide\"); await c.wait(1100); c.$(\"toast\").classList.add(\"hide\");\n    c.cap(1); await c.move(c.$(\"tabEd\")); await c.click();\n    c.$(\"tabApp\").classList.remove(\"cur\"); c.$(\"tabEd\").classList.add(\"cur\"); c.$(\"vApp\").classList.add(\"hide\"); c.$(\"vEd\").classList.remove(\"hide\"); await c.wait(900);\n    c.cap(2); await c.key(\"F12\"); c.$(\"console\").classList.add(\"show\"); await c.wait(700);\n    c.cap(3); await c.key(\"Ctrl\",\"V\");\n    c.$(\"cline\").textContent = \"/* Conseils de classe - appréciations 3A T1 - remplit sans enregistrer */ (function(){ var CLASSE = \\\"TROISIEME A\\\"; …\"; await c.wait(500);\n    await c.key(\"Entrée\");\n    const fills = [TEXTS.a1, TEXTS.a2, TEXTS.a3];\n    for(let i=0;i<3;i++){ const t = c.$(\"t\"+(i+1)); t.textContent = fills[i]; t.classList.add(\"fill\"); c.$(\"n\"+(i+1)).textContent = fills[i].length+\" / 200\"; await c.wait(250); }\n    c.$(\"alert\").classList.remove(\"hide\"); await c.move(c.$(\"okbtn\")); await c.click(); c.$(\"alert\").classList.add(\"hide\");\n    c.cap(4); await c.key(\"F12\"); c.$(\"console\").classList.remove(\"show\"); await c.wait(500);\n    await c.move(c.$(\"save\")); await c.click(); c.$(\"save\").classList.add(\"hit\"); c.$(\"saved\").classList.remove(\"hide\"); await c.wait(2400);\n  }\n};\n\n/* ---------------- lecture : quand l'écran est visible, en boucle ---------------- */\nconst STATE = new Map();\nfunction setup(sec){\n  const stage = sec.querySelector(\".stage\");\n  stage.insertAdjacentHTML(\"beforeend\", CURSOR);\n  STATE.set(sec, {initial: stage.innerHTML, ctx:null, visible:false});\n  sec.querySelector(\".replay\").addEventListener(\"click\", ()=>play(sec));\n}\nfunction stop(sec){ const st = STATE.get(sec); if(st.ctx) st.ctx.tok.alive = false; st.ctx = null; }\nasync function play(sec){\n  stop(sec);\n  const st = STATE.get(sec), stage = sec.querySelector(\".stage\");\n  stage.innerHTML = st.initial;\n  const ctx = makeCtx(sec); st.ctx = ctx;\n  try{\n    await ctx.wait(150);\n    await SCENES[sec.dataset.scene](ctx);\n    ctx.finish();\n    if(REDUCED) return;\n    await ctx.wait(1500);\n    if(st.visible && st.ctx===ctx) play(sec);\n  }catch(e){ /* scène interrompue */ }\n}\nconst scenes = [...document.querySelectorAll(\"[data-scene]\")];\nscenes.forEach(setup);\nfit();\nif(\"IntersectionObserver\" in window){\n  const io = new IntersectionObserver(entries=>entries.forEach(en=>{\n    const st = STATE.get(en.target); st.visible = en.isIntersecting;\n    if(en.isIntersecting && !st.ctx) play(en.target);\n    if(!en.isIntersecting) stop(en.target);\n  }), {threshold:0.35});\n  scenes.forEach(s=>io.observe(s));\n} else scenes.forEach(play);\n<\/script>\n<\/body><\/html>";</script>

function classRank(c){
  const i = CLASSES.indexOf(c); if(i>=0) return 10+i;
  if(/^6/.test(c)) return 0;
  if(/^[3-5]/.test(c)) return 9 + (6-+c[0])*10;
  if(/^2nde/.test(c)) return 100;
  if(/^1re/.test(c)) return 200;
  if(/^Tle/.test(c)) return 300;
  return 400;
}
function classList(){
  const set = new Set(CLASSES);

  return [...set].sort((a,c)=>classRank(a)-classRank(c) || a.localeCompare(c,"fr",{numeric:true}));
}

function parseNum(v){
  if(v==null) return null;
  const s = String(v).trim().replace(",",".").replace(/\s/g,"");

}
function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }
function full(s){ return s.nom + " " + s.prenom; }
function triLabel(t){ return (TRIS.find(x=>x[0]===t)||[t,t])[1]; }
function mentionOf(k){ return MENTIONS.find(m=>m.k===k) || MENTIONS[0]; }
function sorted(list, mode){
  const a = list.slice();
  if(mode==="moy") a.sort((x,y)=>(y.moy??-1)-(x.moy??-1));
  else if(mode==="techno") a.sort((x,y)=>(y.techno??-1)-(x.techno??-1));
  else a.sort((x,y)=>full(x).localeCompare(full(y),"fr"));
  return a;
}
function stats(b){
  const S = b.students, m = S.map(s=>s.moy).filter(x=>x!=null);
  const avg = m.length ? m.reduce((a,c)=>a+c,0)/m.length : null;
  return {
    n:S.length, avg, min:m.length?Math.min(...m):null, max:m.length?Math.max(...m):null,
    fel:S.filter(s=>s.mention==="fel").length, comp:S.filter(s=>s.mention==="comp").length, enc:S.filter(s=>s.mention==="enc").length,
    travail:S.filter(s=>s.garde.travail).length, comportement:S.filter(s=>s.garde.comportement).length,
    vu:S.filter(s=>s.vu).length
  };
}
function findStudent(id){ return book().students.find(s=>s.id===id); }
let toastT=null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, 2600);
}
function copyText(text, label){
  const fallback = () => showModal(label||"Texte à copier", text);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>toast("Copié dans le presse-papiers"), fallback);
    } else fallback();
  }catch(e){ fallback(); }
}
function download(name, text, mime){
  try{
    const blob = new Blob([text], {type:mime||"text/plain;charset=utf-8"});
    const u = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 1500);
    toast("Téléchargement lancé. S’il ne démarre pas, utilisez Copier.");
  }catch(e){ showModal(name, text); }
}
function showModal(title, text){
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>
    <p class="hint">Le texte est sélectionné : copiez-le avec Ctrl+C (ou Cmd+C).</p>
    <textarea id="modalText" readonly>${esc(text)}</textarea>
    <div class="toolbar"><button class="btn primary" data-act="close-modal">Fermer</button></div></div>`;
  m.hidden = false;
  const ta = document.getElementById("modalText"); ta.focus(); ta.select();
}

/* ---------- rendu général ---------- */

  }).join("");
  document.getElementById("selTri").innerHTML = TRIS.map(t=>`<option value="${t[0]}"${t[0]===state.cur.tri?" selected":""}>${t[1]}</option>`).join("");
  const pend = pendingCount(book());
  document.getElementById("tabs").innerHTML = VIEWS.map(v=>`<button class="tab" data-act="view" data-v="${v[0]}" aria-current="${v[0]===state.cur.view}">${v[1]}${v[0]==="actions"&&pend?` <span class="badge" id="pendBadge">${pend}</span>`:""}</button>`).join("");

function render(){
  renderHeader();

function askBtn(what, label, question, cls){
  if(ui.ask===what) return `<span class="confirm">${esc(question)} <button class="btn small danger" data-act="do" data-what="${what}">Oui</button><button class="btn small" data-act="cancel-ask">Annuler</button></span>`;

}
function statStrip(b){

function emptyState(){

}
function prepRows(b){
  const q = norm(ui.q);
  const list = sorted(b.students, ui.sort).filter(s => !q || norm(full(s)).includes(q));
  if(!list.length) return `<tr><td colspan="6" class="empty">Aucun élève ne correspond.</td></tr>`;

    const open = ui.open===s.id;

      <td class="n num" data-l="Moy.">${fmt(s.moy)}</td><td class="n num" data-l="${SUBJ_SHORT}">${fmt(s.techno)}</td>
      <td class="c-men">${mentionSeg(s)}</td><td class="c-meg">${gardeTogs(s)}</td>
      <td><button class="btn small" data-act="toggle-open" data-id="${s.id}">${open?"Fermer":"Détails"}</button></td></tr>`;

      <div><label class="label" for="ag-${s.id}">Appréciation générale</label><textarea id="ag-${s.id}" data-sfield="appGen" data-id="${s.id}">${esc(s.appGen)}</textarea></div>
      <div><label class="label" for="nt-${s.id}">Notes pour le conseil</label><textarea id="nt-${s.id}" data-sfield="notes" data-id="${s.id}">${esc(s.notes)}</textarea></div>
      <div><label class="label" for="nm-${s.id}">Nom</label><input type="text" id="nm-${s.id}" data-sfield="nom" data-id="${s.id}" value="${esc(s.nom)}"></div>
      <div><label class="label" for="pn-${s.id}">Prénom</label><input type="text" id="pn-${s.id}" data-sfield="prenom" data-id="${s.id}" value="${esc(s.prenom)}"></div>
      <div><label class="label" for="mo-${s.id}">Moyenne générale</label><input type="number" step="0.01" min="0" max="20" id="mo-${s.id}" data-sfield="moy" data-id="${s.id}" value="${s.moy??""}"></div>

    </div></td></tr>`;
    return r;
  }).join("");
}

          <div class="tags">${QUICK.map((q,i)=>`<button class="chip" data-act="quick" data-id="${s.id}" data-q="${i}">${esc(q)}</button>`).join("")}</div></div>
      </div>
      <div class="field"><span class="label">Actions à faire pour ${esc(s.prenom)}</span><div class="tasks" id="tasks-${s.id}">${taskItems(s, key(state.cur.cls,state.cur.tri))}</div></div>
      <div class="navrow">

function elapsed(){ return ui.timer.acc + (ui.timer.run ? Date.now()-ui.timer.t0 : 0); }
function updateTimer(){
  const el = document.getElementById("timer"); if(!el) return;
  const sec = Math.floor(elapsed()/1000);
  el.textContent = String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
setInterval(()=>{ if(ui.timer.run) updateTimer(); }, 1000);

/* ---------- Remarques, décisions et actions ---------- */
const QUICK = ["Appeler les parents","Rencontrer la famille","Entretien avec l\u2019élève","Mettre en place une fiche de suivi","Informer la vie scolaire","Contacter le PsyEN ou l\u2019infirmière","Mettre en place un tutorat","Faire le point au prochain conseil"];
function tasksOf(s){
  const done = s.doneTasks || [];
  return String(s.notes||"").split("\n").map(t=>t.replace(/^\s*[-*\u2022]\s*/,"").trim()).filter(Boolean).map(t=>({t, done: done.includes(norm(t))}));
}
function taskItems(s, bk){
  const T = tasksOf(s);
  if(!T.length) return `<p class="hint">Aucune action. Écrivez une remarque par ligne ou cliquez une action rapide.</p>`;
  return T.map((x,i)=>`<label class="task${x.done?" done":""}"><input type="checkbox" data-act="task" data-bk="${bk}" data-id="${s.id}" data-t="${esc(x.t)}"${x.done?" checked":""}><span>${esc(x.t)}</span></label>`).join("");
}
function noteLine(s){
  const T = tasksOf(s); if(!T.length) return "";
  const d = T.filter(x=>x.done).length;
  return `<span class="act-count${d===T.length?" ok":""}">${d===T.length?"Actions faites":`${T.length-d} action${T.length-d>1?"s":""} à faire`}</span> ${esc(T.map(x=>x.t).join(" · "))}`;
}
function pendingCount(b){ return b.students.reduce((n,s)=>n+tasksOf(s).filter(x=>!x.done).length,0); }
function viewActions(b){
  const scope = ui.actScope || "class", show = ui.actShow || "todo";
  const books = scope==="class" ? [[key(state.cur.cls,state.cur.tri), b]] :
    Object.entries(state.data).filter(([k,v])=>v && v.students && v.students.length && !v.example)
      .sort((a,c)=>classRank(a[0].split("|")[0])-classRank(c[0].split("|")[0]) || a[0].localeCompare(c[0],"fr",{numeric:true}));
  let total = 0, done = 0, html = "";
  books.forEach(([bk, bb])=>{
    const rows = sorted(bb.students,"nom").map(s=>{
      const T = tasksOf(s); total += T.length; done += T.filter(x=>x.done).length;
      const vis = T.filter(x=>show==="all" || !x.done);
      if(!vis.length) return "";
      return `<div class="act-student"><div class="who">${esc(s.nom)} <span>${esc(s.prenom)}</span>${s.mention?` <span class="pill m-${s.mention}">${mentionOf(s.mention).l}</span>`:""}${s.garde.travail?' <span class="pill g-travail">MEG travail</span>':""}${s.garde.comportement?' <span class="pill g-comportement">MEG comportement</span>':""}</div>
        <div class="tasks">${vis.map(x=>`<label class="task${x.done?" done":""}"><input type="checkbox" data-act="task" data-bk="${bk}" data-id="${s.id}" data-t="${esc(x.t)}"${x.done?" checked":""}><span>${esc(x.t)}</span></label>`).join("")}</div></div>`;
    }).join("");
    if(rows) html += `<div class="panel"><h2>${esc(bk.split("|")[0])} · ${esc(triLabel(bk.split("|")[1]))}</h2>${rows}</div>`;
  });
  const pct = total ? Math.round(done/total*100) : 0;
  return `<div class="toolbar" style="justify-content:space-between">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Classes"><button data-act="act-scope" data-v="class" aria-pressed="${scope==="class"}" class="m-">${esc(state.cur.cls)} · ${esc(state.cur.tri)}</button><button data-act="act-scope" data-v="all" aria-pressed="${scope==="all"}" class="m-">Toutes mes classes</button></div>
      <div class="seg" role="group" aria-label="Affichage"><button data-act="act-show" data-v="todo" aria-pressed="${show==="todo"}" class="m-">À faire</button><button data-act="act-show" data-v="all" aria-pressed="${show==="all"}" class="m-">Toutes</button></div>
    </div>
    <button class="btn primary" data-act="copy-actions">Copier la liste</button></div>
  <div class="stats"><span class="stat">Actions <b>${total}</b></span><span class="stat enc">Faites <b>${done}</b></span><span class="stat trav">À faire <b>${total-done}</b></span></div>
  <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
  ${html || `<div class="panel empty"><h2>${total?"Toutes les actions sont faites":"Aucune action pour l\u2019instant"}</h2><p>Les lignes écrites dans « Remarques et décisions » apparaissent ici, une action par ligne.</p></div>`}`;
}
function actionsText(){
  const scope = ui.actScope || "class";
  const books = scope==="class" ? [[key(state.cur.cls,state.cur.tri), book()]] : Object.entries(state.data).filter(([k,v])=>v && v.students && v.students.length && !v.example);
  const L = [];
  books.forEach(([bk,bb])=>sorted(bb.students,"nom").forEach(s=>tasksOf(s).forEach(x=>{
    L.push(`[${x.done?"x":" "}] ${bk.split("|")[0]} ${bk.split("|")[1]} - ${full(s)} : ${x.t}`);
  })));
  return L.join("\n") || "Aucune action.";
}

function subjectAvg(b, name){
  const k = norm(name);
  const vals = b.students.map(s => k==="physique-chimie" ? s.techno : Object.entries(s.mat||{}).filter(([m])=>norm(prettySubject(m))===k).map(([,v])=>v)[0]).filter(v=>v!=null);
  return vals.length ? vals.reduce((a,c)=>a+c,0)/vals.length : null;
}
function ensureProfs(b){
  if(!b.profs) b.profs = [];
  const have = new Set(b.profs.map(p=>norm(p.matiere)));
  const order = (b.subjects && b.subjects.length) ? b.subjects.slice() : [];
  b.students.forEach(s=>Object.keys(s.mat||{}).forEach(k=>{ if(!order.includes(k)) order.push(k); }));
  let names = order.map(prettySubject);
  if(!names.some(n=>norm(n)==="physique-chimie")) names.push("Physique-chimie");
  names.forEach(n=>{
    if(have.has(norm(n))) return;
    have.add(norm(n));
    b.profs.push({id:uid(), matiere:n, prof: "", bilan:""});
  });
}
function isAuto(b){ return b.bilanAuto===true || (b.bilanAuto!==false && !String(b.bilan||"").trim()); }

/* thèmes repérés dans les bilans : [id, mots-clés, formulation positive, formulation négative] */
const THEMES = [
  ["ambiance", ["agreable","calme","ambiance","sympathique","bonne entente","plaisant"], "classe agréable", "climat de classe à améliorer"],
  ["serieux", ["serieu","investi","implique","implication","motive","motivation","volontaire","impliques"], "sérieux et investissement", "manque de sérieux et d\u2019investissement"],
  ["participation", ["particip","dynamique","curieu","interesse","enthousias","oral"], "participation active", "participation insuffisante"],
  ["travail", ["travail","lecons","devoirs","apprendre","revis","regulier","travailleu"], "travail régulier", "travail personnel insuffisant"],
  ["resultats", ["resultat","bon niveau","reussi","satisfaisant","excellent","tres bien","bons","bonne classe","notes"], "bons résultats", "résultats fragiles"],
  ["concentration", ["concentr","attentif","attentive","attentifs","attention en classe","ecoute","inattent","distrait","dissip"], "bonne écoute et concentration", "manque de concentration"],
  ["bavardages", ["bavard","bruy","agit","turbulen","bruit"], "", "bavardages et agitation"],
  ["heterogene", ["heterog","ecart","disparate","deux vitesses","groupe d\u2019eleves","petit groupe"], "", "niveau hétérogène, un groupe en difficulté"],
  ["materiel", ["oubli","materiel","affaires"], "", "oublis de matériel"],
  ["autonomie", ["autonom"], "bonne autonomie", "autonomie à développer"],
  ["progres", ["progres","amelior","en hausse"], "progrès constatés", ""]
];
const NEG_RE = /(manque|insuffis|pas assez|peu |trop|doit|doivent|devra|devront|faut|attention a|difficult|fragile|faible|irregul|decevant|regrett|inquiet|dommage|n.est pas|ne sont pas|pas toujours|a ameliorer|perturb)/;
function summarizeBilans(b){
  const pos = new Map(), neg = new Map();
  const add = (map, label, subj) => { if(!label) return; if(!map.has(label)) map.set(label, new Set()); map.get(label).add(subj); };
  (b.profs||[]).forEach(p=>{
    const txt = norm(p.bilan).replace(/[’]/g,"'");
    if(!txt.trim()) return;
    const subj = p.matiere;
    txt.split(/[.!?;\n]+/).forEach(sent=>{
      if(!sent.trim()) return;
      const negative = NEG_RE.test(sent+" ");
      THEMES.forEach(([id, keys, lp, ln])=>{
        if(!keys.some(k=>sent.includes(k))) return;
        if(!lp) add(neg, ln, subj);
        else if(!ln) { if(!negative) add(pos, lp, subj); }
        else if(negative) add(neg, ln, subj);
        else add(pos, lp, subj);
      });
    });
  });
  const list = map => [...map.entries()].sort((a,c)=>c[1].size-a[1].size)
    .map(([l,set])=>`${l} (${set.size>=4 ? set.size+" matières" : [...set].join(", ")})`);
  const L = [];
  const filled = (b.profs||[]).filter(p=>p.bilan.trim()).length;
  if(!filled) return "";
  const P = list(pos), N = list(neg);
  if(P.length) L.push(`Points forts : ${P.join(" ; ")}.`);
  if(N.length) L.push(`Points de vigilance : ${N.join(" ; ")}.`);
  if(!P.length && !N.length) L.push(`${filled} bilan${filled>1?"s":""} renseigné${filled>1?"s":""}, voir le détail par matière.`);
  const tone = P.length && !N.length ? "Bilan positif dans l\u2019ensemble." : N.length && !P.length ? "Bilan préoccupant : des efforts sont attendus." : P.length && N.length ? (P.length>=N.length ? "Bilan globalement satisfaisant, avec des points à surveiller." : "Bilan mitigé : la classe doit se mobiliser sur les points de vigilance.") : "";
  if(tone) L.push(tone);
  return L.join("\n");
}

function crText(b){
  const s = stats(b), list = sorted(b.students,"nom");
  const d = b.date ? b.date.split("-").reverse().join("/") : "à compléter";
  const L = [];
  L.push(`CONSEIL DE CLASSE ${state.cur.cls} - ${triLabel(state.cur.tri).toUpperCase()}`);

  if(b.presents.trim()) L.push(`Présents : ${b.presents.trim()}`);
  L.push(`Effectif : ${s.n} élèves · Moyenne de classe : ${fmt(s.avg)} (min ${fmt(s.min)} · max ${fmt(s.max)})`);
  const sec = (t, body) => { L.push(""); L.push(t); L.push(body && body.trim() ? body.trim() : "-"); };
  sec("BILAN DE LA CLASSE", b.bilan);
  const pb = (b.profs||[]).filter(p=>p.bilan.trim());
  L.push(""); L.push("BILANS DES PROFESSEURS");

  sec("INTERVENTION DES DÉLÉGUÉS ÉLÈVES", b.delegues);

  const grp = (t, arr) => { L.push(""); L.push(`${t} (${arr.length})`); L.push(arr.length ? arr.map(x=>`- ${full(x)} (${fmt(x.moy)})`).join("\n") : "-"); };
  grp("FÉLICITATIONS", list.filter(x=>x.mention==="fel"));
  grp("COMPLIMENTS", list.filter(x=>x.mention==="comp"));
  grp("ENCOURAGEMENTS", list.filter(x=>x.mention==="enc"));
  grp("MISES EN GARDE TRAVAIL", list.filter(x=>x.garde.travail));
  grp("MISES EN GARDE COMPORTEMENT", list.filter(x=>x.garde.comportement));
  const notes = list.filter(x=>x.notes.trim());
  L.push(""); L.push("REMARQUES INDIVIDUELLES");
  L.push(notes.length ? notes.map(x=>`- ${full(x)} : ${x.notes.trim().replace(/\s*\n\s*/g," ")}`).join("\n") : "-");
  return L.join("\n");
}
function tsv(b){
  const head = ["Nom","Prénom","Moyenne","Physique-chimie","Mention","MEG travail","MEG comportement","Appréciation générale","Appréciation physique-chimie","Remarques"];

}

function techLevel(n){ return n>=16?5 : n>=14?4 : n>=12?3 : n>=10?2 : n>=8?1 : 0; }
function bavOf(s){ const v = +s.bav; return isNaN(v) ? 0 : Math.max(0, Math.min(4, Math.round(v))); }
function nameForms(p){
  p = String(p||"").trim() || "l’élève";
  const v = /^[aeiouyhàâäéèêëîïôöùûüÿ]/i.test(p);
  return { P:p, deP:(v ? "d’" : "de ")+p };
}
function genKeys(s){
  const lv = techLevel(s.techno), bv = bavOf(s);
  const band = lv>=4 ? "hi" : lv>=2 ? "mid" : "lo";
  return ["r"+lv, "c"+bv, "t"+band+(bv<=1?"good":"bad")];
}
function genPool(k){ return k[0]==="r" ? GEN.res[+k.slice(1)] : k[0]==="c" ? GEN.comp[+k.slice(1)] : GEN.tip[k.slice(1)]; }
function usageMap(b, except){
  const used = {};
  b.students.forEach(x=>{
    if(x===except || !x.appKeys || !x.appIdx || x.appAuto!==x.appTechno) return;
    x.appKeys.forEach((k,i)=>{ (used[k] = used[k] || {})[x.appIdx[i]] = ((used[k]||{})[x.appIdx[i]]||0) + 1; });
  });
  return used;
}
function pickVariant(pool, counts, avoid){
  let ids = pool.map((_,i)=>i);
  if(avoid!=null && ids.length>1) ids = ids.filter(i=>i!==avoid);
  const c = i => (counts && counts[i]) || 0;
  const min = Math.min(...ids.map(c));
  const best = ids.filter(i=>c(i)===min);
  return best[Math.floor(Math.random()*best.length)];
}
const APP_LIMIT = 200;
function generateApp(s, used, other){
  const keys = genKeys(s), f = nameForms(s.prenom), pools = keys.map(genPool);
  const sameKeys = other && s.appKeys && s.appKeys.join()===keys.join();
  const fill = t => t.replace(/\{P\}/g, f.P).replace(/\{deP\}/g, f.deP);
  const combos = [];
  pools[0].forEach((_,i)=>pools[1].forEach((_,j)=>pools[2].forEach((_,k)=>{
    const idx = [i,j,k], text = idx.map((x,n)=>fill(pools[n][x])).join(" ");
    let score = idx.reduce((sum,x,n)=>sum + (((used[keys[n]]||{})[x])||0), 0);
    if(sameKeys) score += idx.filter((x,n)=>x===s.appIdx[n]).length * 100;
    combos.push({idx, text, score});
  })));
  let ok = combos.filter(c=>c.text.length<=APP_LIMIT);
  if(!ok.length){ const m = Math.min(...combos.map(c=>c.text.length)); ok = combos.filter(c=>c.text.length===m); }
  const min = Math.min(...ok.map(c=>c.score)), best = ok.filter(c=>c.score===min);
  const pick = best[Math.floor(Math.random()*best.length)];
  keys.forEach((k,n)=>{ used[k] = used[k] || {}; used[k][pick.idx[n]] = (used[k][pick.idx[n]]||0) + 1; });
  s.appTechno = pick.text; s.appAuto = pick.text; s.appKeys = keys; s.appIdx = pick.idx;
  return pick.text;
}
function ccText(t){ return `${t.length} / ${APP_LIMIT}`; }
function setCC(id, t){ const cc = document.getElementById("cc-"+id); if(cc){ cc.textContent = ccText(t); cc.classList.toggle("over", t.length>APP_LIMIT); } }
function generateMany(b, onlyEmpty){
  const used = usageMap(b, null);
  let n = 0, miss = 0;
  sorted(b.students,"nom").forEach(s=>{
    if(onlyEmpty && s.appTechno.trim()) return;
    if(s.techno==null){ miss++; return; }
    if(!onlyEmpty && s.appAuto===s.appTechno && s.appKeys) s.appKeys.forEach((k,i)=>{ if(used[k] && used[k][s.appIdx[i]]) used[k][s.appIdx[i]]--; });
    generateApp(s, used, false); n++;
  });
  return {n, miss};
}
function refreshAppRow(s){
  const ta = document.getElementById("ta-"+s.id); if(ta) ta.value = s.appTechno;
  setCC(s.id, s.appTechno);
}

/* ---------- Synchronisation chiffrée (Firebase REST, sans SDK ni clé API) ---------- */
const DB_URL = "https://site-edel-default-rtdb.europe-west1.firebasedatabase.app";
const SYNC_KEY = "conseils-de-classe-pc-sync-v1";
const SYNC_SALT = "conseils-de-classe-pc-estic|v1";
const sync = { id:null, key:null, st:"off", msg:"", last:0, busy:false, pending:false, timer:null, conflict:null };
function b64(buf){ let s = ""; new Uint8Array(buf).forEach(c=>{ s += String.fromCharCode(c); }); return btoa(s); }
function unb64(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }
function b64u(buf){ return b64(buf).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function deriveSync(pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:enc.encode(SYNC_SALT), iterations:600000}, base, 512));
  return { raw: bits.slice(0,32), id: b64u(bits.slice(32)) };
}
function aesKey(raw){ return crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, false, ["encrypt","decrypt"]); }
function nodeUrl(){ return DB_URL + "/conseils/" + sync.id + ".json"; }
async function encryptState(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, sync.key, new TextEncoder().encode(JSON.stringify(state)));
  return { iv:b64(iv), data:b64(ct), maj: state.maj || Date.now() };
}
async function decryptDoc(doc){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(doc.iv)}, sync.key, unb64(doc.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function pull(){
  const r = await fetch(nodeUrl(), {cache:"no-store"});
  if(!r.ok) throw new Error("http " + r.status);
  return r.json();
}
async function push(){
  const doc = await encryptState();
  /* POST + x-http-method-override : requête simple, sans en-tête Content-Type ni pré-vérification CORS */
  const r = await fetch(nodeUrl() + "?x-http-method-override=PUT&print=silent", {method:"POST", body:JSON.stringify(doc)});
  if(!r.ok) throw new Error("http " + r.status);
  sync.last = Date.now();
}
function hhmm(t){ const d = new Date(t); return String(d.getHours()).padStart(2,"0")+"h"+String(d.getMinutes()).padStart(2,"0"); }
function dateFr(t){ if(!t) return "date inconnue"; const d = new Date(t); return d.toLocaleDateString("fr-FR")+" à "+hhmm(t); }
function syncErr(e){
  const m = String(e && e.message || "");
  if(/http 40[13]/.test(m)) return "Accès refusé par la base : vérifiez les règles Firebase.";
  if(/http/.test(m)) return "La base a renvoyé une erreur ("+m.replace("http ","")+").";
  if(e && e.name==="OperationError") return "Déchiffrement impossible : la phrase ne correspond pas à ces données.";
  return "Base injoignable : pas de connexion, ou page ouverte dans Claude.";
}
function setSync(st, msg){
  sync.st = st; sync.msg = msg || "";
  const pill = document.getElementById("syncState");
  if(pill){
    pill.dataset.st = st;
    pill.textContent = st==="off" ? "Synchro désactivée" : st==="ok" ? "Synchronisé "+hhmm(sync.last||Date.now()) :
      st==="run" ? "Synchronisation…" : st==="wait" ? "Synchro : choix à faire" : "Synchro impossible";
    pill.title = sync.msg || pill.textContent;
  }
  const m = document.getElementById("syncMsg"); if(m) m.textContent = syncLine();
}
function syncLine(){
  if(sync.st==="ok") return "Données chiffrées et synchronisées à "+hhmm(sync.last||Date.now())+".";
  if(sync.st==="run") return sync.msg || "Synchronisation en cours…";
  if(sync.st==="err") return sync.msg;
  if(sync.st==="wait") return "Les données de la base et celles de cet appareil diffèrent.";
  return "";
}
function scheduleSync(){
  if(!sync.id || sync.conflict) return;
  clearTimeout(sync.timer);
  setSync("run");
  sync.timer = setTimeout(doPush, 1500);
}
async function doPush(){
  if(!sync.id) return;
  if(sync.busy){ sync.pending = true; return; }
  sync.busy = true;
  try{ await push(); setSync("ok"); }catch(e){ setSync("err", syncErr(e)); }
  sync.busy = false;
  if(sync.pending){ sync.pending = false; doPush(); }
}
function hasRealData(){ return Object.values(state.data).some(b=>b && b.students && b.students.length && !b.example); }
async function applyRemote(doc){
  try{
    const s = await decryptDoc(doc);
    if(!s || s.v!==1 || !s.data) throw new Error("format");
    state = Object.assign(freshState(), s, {data:s.data});
    saveLocalOnly(); sync.last = Date.now(); setSync("ok"); render();
    toast("Données récupérées depuis la base");
  }catch(e){ setSync("err", e.name==="OperationError" ? syncErr(e) : "Les données de la base sont illisibles."); }
}
/* interactive : après saisie de la phrase, on demande en cas de désaccord ; sinon la version la plus récente gagne */
async function reconcile(interactive){
  setSync("run", "Lecture de la base…");
  let doc;
  try{ doc = await pull(); }catch(e){ setSync("err", syncErr(e)); return; }
  if(!doc || !doc.data){ await doPush(); if(sync.st==="ok") toast("Données envoyées dans la base"); return; }
  const lm = state.maj || 0, rm = doc.maj || 0;
  if(!hasRealData()){ await applyRemote(doc); return; }
  if(rm===lm){ sync.last = Date.now(); setSync("ok"); return; }
  if(!interactive){ if(rm>lm) await applyRemote(doc); else await doPush(); return; }
  sync.conflict = {doc, rm, lm}; setSync("wait"); render();
}
async function connectSync(pass, remember){
  setSync("run", "Préparation de la clé de chiffrement…");
  try{
    const d = await deriveSync(pass);
    sync.id = d.id; sync.key = await aesKey(d.raw);
    if(remember){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify({id:d.id, k:b64(d.raw)})); }catch(e){} }
  }catch(e){ sync.id = null; sync.key = null; setSync("err", "Le chiffrement n’est pas disponible dans ce navigateur."); render(); return; }
  render();
  await reconcile(true);
  render();
}
function disconnectSync(){
  try{ localStorage.removeItem(SYNC_KEY); }catch(e){}
  clearTimeout(sync.timer);
  Object.assign(sync, {id:null, key:null, conflict:null, last:0}); setSync("off"); render();
}
async function initSync(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SYNC_KEY) || "null"); }catch(e){}
  if(!saved || !saved.id || !saved.k || !(window.crypto && crypto.subtle)) { setSync("off"); return; }
  try{ sync.id = saved.id; sync.key = await aesKey(unb64(saved.k)); }catch(e){ sync.id = null; setSync("off"); return; }
  await reconcile(false);
}
function syncPanel(){
  if(!sync.id) return `<div class="panel"><h2>Synchronisation en ligne</h2>
      <p class="hint">Retrouvez vos données sur tous vos postes. Elles sont chiffrées dans le navigateur avant l’envoi : la base ne contient rien de lisible. La phrase secrète n’est enregistrée nulle part.</p>
      <div class="field"><label class="label" for="syncPass">Phrase secrète</label><input type="password" id="syncPass" autocomplete="current-password" placeholder="La même sur chaque appareil"></div>
      <label class="radio"><input type="checkbox" id="syncRemember" checked> Se souvenir sur cet appareil</label>
      <div class="toolbar"><button class="btn primary" data-act="sync-connect">Activer la synchronisation</button><span class="hint" id="syncMsg">${esc(syncLine())}</span></div>
    </div>`;
  if(sync.conflict){
    const c = sync.conflict;
    return `<div class="panel"><h2>Synchronisation en ligne</h2>
      <p>Les données de la base et celles de cet appareil diffèrent. Lesquelles garder ?</p>
      <div class="toolbar"><button class="btn primary" data-act="sync-keep-remote">Garder la base (modifiée le ${esc(dateFr(c.rm))})</button>
        <button class="btn" data-act="sync-keep-local">Garder cet appareil (modifié le ${esc(dateFr(c.lm))})</button></div>
      <p class="hint">La version écartée est remplacée. Exportez une sauvegarde avant si vous hésitez.</p>
    </div>`;
  }
  return `<div class="panel"><h2>Synchronisation en ligne</h2>
      <p class="hint" id="syncMsg">${esc(syncLine())}</p>
      <p class="hint">Chaque modification est chiffrée puis envoyée automatiquement. Sur un autre appareil, activez la synchronisation avec la même phrase.</p>
      <div class="toolbar"><button class="btn" data-act="sync-now">Synchroniser maintenant</button>${askBtn("sync-off","Désactiver sur cet appareil","Oublier la phrase sur cet appareil ? Les données restent ici et dans la base.","btn")}</div>
    </div>`;
}

/* ---------- Transfert vers École Directe ---------- */
const ED_LEVELS = {"6":"SIXIEME","5":"CINQUIEME","4":"QUATRIEME","3":"TROISIEME"};
function edLabel(c){
  if(c==="3PM") return "TROISIEME PREPA METIERS";
  const m = c.match(/^(2nde|1re|Tle)\s*(.*)$/);
  if(m) return ({"2nde":"SECONDE","1re":"PREMIERE","Tle":"TERMINALE"}[m[1]] + " " + m[2]).trim();
  return (ED_LEVELS[c[0]]||c[0]) + " " + c.slice(1).replace(/^e\s*/,"");
}
/* Script autonome à coller dans la console de la page Appréciations d'École Directe.
   Il associe chaque zone de saisie au nom de l'élève sur sa ligne, remplit sans enregistrer, et laisse vérifier. */
function edScript(items){
  const kk = v => norm(v).replace(/[^a-z0-9]/g,"");
  const data = items.map(x=>({n:x.nom+" "+x.prenom, k:kk(x.nom+x.prenom), nk:kk(x.nom), pk:kk(x.prenom), t:x.appTechno.trim()}));
  const cls = edLabel(state.cur.cls);
  return `/* Conseils de classe - appréciations ${state.cur.cls} ${state.cur.tri} - remplit sans enregistrer */
(function(){
var CLASSE = ${JSON.stringify(cls)};
var ECRASER = false; /* true : remplace aussi les appréciations déjà saisies */
var DATA = ${JSON.stringify(data)};
var K = function(s){ return String(s||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,""); };
/* texte de la ligne + bulles d'aide (title) : École Directe coupe les noms longs à l'affichage */
var T = function(e){ var s = e.innerText || e.textContent || ""; Array.prototype.forEach.call(e.querySelectorAll ? e.querySelectorAll("[title]") : [], function(x){ s += " " + x.getAttribute("title"); }); return s; };
/* nom complet trouvé, sinon nom + début du prénom (prénom coupé par « ... ») */
var match = function(txt){
  var best = null, bestScore = 0, tie = false;
  DATA.forEach(function(d){
    if(used[d.k]) return;
    var sc = 0;
    if(txt.indexOf(d.k) >= 0) sc = 100000 + d.k.length;
    else {
      var i = txt.indexOf(d.nk);
      if(i >= 0 && d.nk.length >= 2){
        var rest = txt.slice(i + d.nk.length), L = 0;
        while(L < d.pk.length && rest.charAt(L) === d.pk.charAt(L)) L++;
        if(L >= Math.min(3, d.pk.length)) sc = d.nk.length*100 + L;
      }
    }
    if(sc > bestScore){ best = d; bestScore = sc; tie = false; }
    else if(sc && sc === bestScore && best && best.k !== d.k) tie = true;
  });
  return tie ? null : best;
};
var page = K(T(document.body));
if(page.indexOf(K(CLASSE))<0 && !confirm("La page ne semble pas afficher la classe " + CLASSE + ". Continuer quand même ?")) return;
var setVal = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, "value").set;
var tas = Array.prototype.slice.call(document.querySelectorAll("textarea"));
var used = {}, filled = 0, kept = 0, noRow = 0;
tas.forEach(function(ta){
  var el = ta, hit = null;
  while(el && el !== document.body && !hit){
    el = el.parentElement;
    if(!el || el.querySelectorAll("textarea").length > 1) break;
    hit = match(K(T(el)));
  }
  if(!hit){ noRow++; return; }
  used[hit.k] = true;
  if(ta.value.trim() && ta.value.trim() !== hit.t && !ECRASER){ kept++; ta.style.outline = "3px solid #e0a000"; return; }
  ta.focus();
  setVal.call(ta, hit.t);
  ["input","change","keyup","blur"].forEach(function(t){ ta.dispatchEvent(new Event(t, {bubbles:true})); });
  ta.style.outline = "3px solid #2f9e5a";
  filled++;
});
var missing = DATA.filter(function(d){ return !used[d.k]; }).map(function(d){ return d.n; });
var empty = tas.filter(function(ta){ return ta.offsetParent !== null && !ta.value.trim(); });
empty.forEach(function(ta){ ta.style.outline = "3px dashed #e0a000"; });
var msg = filled + " appréciation(s) remplie(s)." +
  (kept ? "\\n" + kept + " déjà saisie(s), laissée(s) telle(s) quelle(s) (encadrée(s) en orange)." : "") +
  (missing.length ? "\\nÉlèves non trouvés sur la page : " + missing.join(", ") : "") +
  (empty.length ? "\\n" + empty.length + " case(s) encore vide(s), encadrée(s) en pointillés orange : élève(s) sans appréciation dans l\u2019appli." : "") +
  "\\n\\nVérifiez puis cliquez sur la disquette pour enregistrer.";
console.log(msg); alert(msg);
})();`;
}
